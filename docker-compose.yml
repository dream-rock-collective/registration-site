services:
  admin-site:
    build:
      context: ./admin-site
    ports:
      - "6942:6942"
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/collective_admin
      REGISTRATION_SITE_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collective_admin
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d collective_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
